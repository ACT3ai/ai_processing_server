# The act3-nats Docker container's config (`just broker-docker` copies it in): the same broker as standalone.conf.tmpl,
# with the container's own paths. Ports are published on 127.0.0.1 only.
server_name: "aps_docker"
host: "0.0.0.0"
port: 4222
http: "0.0.0.0:8222"

jetstream {
  store_dir: "/data"
  max_file_store: 21474836480
  max_memory_store: 268435456
  # fsync every write (D-026), as on a native broker
  sync_interval: always
}

max_payload: 1MB
