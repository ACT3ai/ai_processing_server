# Priority bands (pm/task_queue.mdx §14.2). Admission maps the 0..300 priority to a band; workers pull bands in
# order. Phase Q1 pulls strictly p0 first; the DRR weights and aging are phase Q2 (§14.4).
schema_version: 1
bands:
  - { name: p0, min_priority: 150, weight: 16, max_wait: 0s }
  - { name: p1, min_priority: 75,  weight: 8,  max_wait: 5m }
  - { name: p2, min_priority: 50,  weight: 4,  max_wait: 15m }
  - { name: p3, min_priority: 25,  weight: 2,  max_wait: 1h }
  - { name: p4, min_priority: 0,   weight: 1,  max_wait: 6h }
max_promotions: 2
