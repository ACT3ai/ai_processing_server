# Presets that let `init` name known machines without typing (pm/ai_processing_server.mdx §6.6).
# Identity hints only: detection is truth for hardware. Hostnames marked "guess" need confirming (§23 Q2).
schema_version: 1
servers:
  - key: BLAP
    display_name: "Bryan Laptop"
    match: { hostname: ["Bry-MacBook-Pro-2025b", "Bry-MacBook-Pro-2025b.local"] }   # detected 2026-10-27
    profile: generic
    family: bryan
    site: bryan_office
  - key: B5090
    display_name: "Bryan 5090"
    match: { hostname: ["bryan-5090", "DESKTOP-B5090"], gpu_name_contains: "RTX 5090" }   # hostnames: guess
    profile: b5090
    family: bryan
    site: bryan_office
  - key: BPC
    display_name: "Bryan PC"
    match: { hostname: ["BRYAN-PC"], gpu_count_min: 2 }          # guess
    profile: bpc
    family: bryan
    site: bryan_office
  - key: BMT
    display_name: "Bryan Mac Tower"
    match: { hostname: ["Bryan-Mac-Tower"] }                     # guess
    profile: bmt
    family: bryan
    site: bryan_office
  - key: BMS
    display_name: "Bryan Mac Studio"
    match: { hostname: ["Bryan-Mac-Studio"] }                    # guess
    profile: bms
    family: bryan
    site: bryan_office
    services_off: [act3.video_gen_open_source]                  # OpenClaw is the tenant here
