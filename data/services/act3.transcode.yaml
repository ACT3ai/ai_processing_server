schema_version: 1
id: act3.transcode
platform: act3
title: "Export transcode: H.264 + AAC + yuv420p MP4 (social exports)"
runner: ffmpeg
default_enabled: true
requires:
  engines: { ffmpeg: ">=6.0", ffprobe: ">=6.0" }
  gpu: optional
  compute: [cuda, metal, none]
resources_per_job: { cpu_cores: 2, ram_gb: 2, vram_gb: 0 }
max_parallel_default: 3
timeouts: { stage_inputs: 10m, run: 60m, upload: 20m }
retry: { max_attempts: 2, retry_on: [transient, infra] }
