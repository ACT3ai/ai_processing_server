schema_version: 1
id: act3.video_gen_open_source
platform: act3
title: "Open-source video generation: Wan 2.2, LTX 2.5, Hunyuan 1.5"
runner: comfy
default_enabled: true
requires:
  gpu: required
  compute: [cuda, metal]
  min_vram_gb: 24
  min_unified_memory_gb: 96
resources_per_job: { cpu_cores: 4, ram_gb: 32, vram_gb: 24 }
max_parallel_default: 1
timeouts: { stage_inputs: 30m, run: 120m, upload: 20m }
retry: { max_attempts: 2, retry_on: [transient, infra] }
