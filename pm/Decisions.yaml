- id: D-014
  title: "Task system: NATS JetStream, run as its own nats-server process (never embedded); our binary is a client"
  status: decided
  date: 2026-10-27
  decision: >
    Every render queue server (B5090, the Mac Studio, the three Nepal machines, and the rest of the fleet) runs its own
    nats-server as an OS service (a leaf node to a hub); ai_processing_server connects as a client. All callers, including
    internal software on the same machine, submit through our APIs (NATS subjects, the HTTPS gateway, or the local API)
    and read events and results back. Running tasks live in detached task hosts from frozen code snapshots, so a git pull
    and a controller restart never break a task underway.
  why: >
    Bryan's third dictation (2026-10-27): "NATS with JetStream (separate nats-server process)". Confirms task_queue.mdx
    D-Q1 (vendor ranking §1–§3) and supersedes D-001 (HTTPS lease). Tasks take 30 s to 30+ min while code updates very
    often; a broker outside our binary keeps queued jobs and claims through every restart.
  consequence: >
    D-008's Asynq-shaped job record gives way to task_queue.mdx §13 state names when the queue is wired in. apis.mdx's
    lease endpoints become the HTTPS gateway only. Task authors follow pm/task_authoring.mdx (rules R1–R15, gate G1–G7).

- id: D-015
  title: "Queue v1 (standalone): inline admission and strict band order; Q2 adds admission, DRR and caller shares"
  status: decided for v0.2.0
  date: 2026-10-27
  decision: >
    Submit publishes straight to work.<band>.<caller>.<service> (no SUBMIT stream, no signature or caller policy yet).
    A worker pulls lanes in strict order: band p0..p4, then enabled callers (callers.<id>.enabled), then services with a
    free slot, one job per pull, only while running + claimed-but-waiting jobs stay under max_parallel_jobs.
    Streams and KV buckets are defined in code (natsq.setup), not data/queue/streams.yaml.
  why: >
    Gets jobs flowing through NATS on one machine now; hub admission, signatures, DRR, aging and caller shares
    (task_queue.mdx §11, §14, §15) need the hub (Q3) and Bryan's answers in §24 to be worth building.
  consequence: "p4 can starve under a constant p0 load until DRR lands (acceptance Q6 is not met yet)."

- id: D-016
  title: "Local job record keeps Asynq's names and adds caller_state (task_queue.mdx §13.4); job_state and events use §13.4"
  status: decided
  date: 2026-10-27
  decision: >
    The server's own table and journal keep D-008's fields and states (pending, active, retry, completed, archived,
    cancelled), so direct mode and its 79 tests are unchanged. Every record also carries caller_state (QUEUED, CLAIMED,
    STAGING, RUNNING, UPLOADING, SUCCEEDED, FAILED, CANCELLED), which is what the queue's job_state KV and events say.
    Queued jobs run with max_retry 0 locally: the queue owns their retries (attempt = deliveries).
  why: >
    D-014's consequence asked for §13 state names once the queue is wired in. Renaming the local states would churn
    every direct-mode client and test for no gain to callers, who only see job_state and events.

- id: D-017
  title: "Claims survive a restart through the journal: re-attach if the runner can, else requeue at once"
  status: decided
  date: 2026-10-27
  decision: >
    The job journal stores each held job's claim (ack subject, fencing revision, attempt). At boot, once the broker
    answers, each claim still owned by this server (revision and server key match) is either run again here under the
    same claim and attempt, when its runner implements runners.Reattacher (detached task hosts, task_queue.mdx §9), or
    returned to the queue at once as the next attempt. A claim taken over by another worker is left alone.
  why: >
    Without it a restart leaves held jobs stuck until ack_wait (5 min). Agreed 2026-10-27 with the session building
    the oss_video / oss_upscale runners and task hosts, whose Run is idempotent per job id.

- id: D-020
  title: "Task authoring answers: Nepal NPL1-3; upscale first with SeedVR2; Wan 2.2 A14B, no Wan 2.1; task code lives in this repo"
  status: decided
  date: 2026-10-27
  decision: >
    Nepal machines are NPL1, NPL2, NPL3 (family office, site nepal_office, local_mode idle_only), customer data allowed
    once enrollment verifies disk encryption and the server key. The first task type is video upscale
    (act3.upscale_open_source, SeedVR2 standard/best/sharp on CUDA and Metal); FlashVSR is next for fast CUDA previews,
    Real-ESRGAN is the low-VRAM fallback, Topaz and other vendors are never used here. Wan 2.2 A14B (wan2.2-a14b) is the
    video model; Wan 2.1 is not built. ACT3 task code is copied into this repo and snapshotted (no pinned packages).
  why: >
    Bryan asked for every open question to be decided (2026-10-27). These match what backend-a2 already built and what
    Bryan's third dictation named first. pm/task_authoring.mdx §10.

- id: D-021
  title: "Queue policy: WTC ceiling p1, unknown callers p3; vendor API jobs never on our servers; no custom graphs; local modes per machine; hub on a cloud VM later"
  status: decided
  date: 2026-10-27
  decision: >
    Caller band ceilings act3 p0, local p0, wtc p1, any other p3, clamped at submit and honored in the pull order.
    vendor:* models and the vendor_api category are refused at submit and at claim; vendor work stays in job_runner
    and appsrv. Only checked-in graph templates and scripts run. Local job mode first on BLAP and BMT, share on B5090,
    BPC and BMS, idle_only on Nepal and cloud, written by init from known_servers.yaml local_mode. Owners can fence
    models with models.allow / models.deny in this_server.yaml. Hub is a small cloud VM (queue.act3ai.com) in ACT3's
    production AWS region, in phase Q3; until then every machine is standalone. Criteria weights v2 kept; self-claim
    off; Python is the default runner language for ML tasks; job_runner is not retrofitted.
  why: "pm/task_queue.mdx §24, answered at Bryan's request."
  code: >
    code/internal/queue/queue.go (CallerCeilings, ClampPriority, ClampBand, VendorModel, Envelope.Normalize);
    code/internal/config/types.go (LocalMode, ModelRules.Allowed); code/internal/scheduler/queue.go (pullOrder,
    acceptDelivery model check); data/servers/known_servers.yaml (local_mode, NPL1-3); data/templates/this_server.template.yaml.

